# Kiro defaults for noctalia v5 (native shell, [extra]/noctalia).
# Only the values Kiro changes from noctalia's built-in defaults live here;
# see /usr/share/doc/noctalia/README.md and https://docs.noctalia.dev/noctalia/.
# Files in ~/.config/noctalia/ merge alphabetically, so a later config.toml
# overrides this one; changes made in Settings land in
# ~/.local/state/noctalia/settings.toml and win over both.

[shell]
font_family          = "Noto Sans"
telemetry_enabled    = false
# The ISO and installs come preconfigured; skip the first-run welcome wizard.
setup_wizard_enabled = false
# v4 shipped the polkit-agent plugin; v5 has the agent built in.
polkit_agent         = true

[theme]
mode   = "dark"
# Colours come from the wallpaper (Variety hands each one to noctalia), like the DMS editions.
source = "wallpaper"

# Alacritty follows that palette: noctalia writes alacritty/themes/noctalia.toml and adds the
# import to ~/.config/alacritty/alacritty.toml itself (it creates the file when there is none).
[theme.templates]
builtin_ids = ["alacritty"]

[bar.main]
position = "top"
start    = ["launcher", "clock", "sysmon", "active_window", "media"]
center   = ["workspaces"]
end      = ["tray", "notifications", "network", "bluetooth", "battery", "volume", "brightness", "control-center"]

[dock]
enabled       = true
auto_hide     = true
# v5 reserves the dock's strip by default even while auto-hidden, leaving an
# empty gap under tiled windows.
reserve_space = false

# Screen off after 15 min idle, like XFCE. noctalia ships it disabled.
[idle.behavior.screen-off]
timeout        = 900
command        = "noctalia:dpms-off"
resume_command = "noctalia:dpms-on"
enabled        = true

# Present but off: Kiro never locks on idle by default. Turn it on in Settings.
[idle.behavior.lock]
timeout = 900
command = "noctalia:session lock"
enabled = false
